name: .NET CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # -------------------------
  # CI - Build and Test
  # -------------------------
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish application
        run: dotnet publish ./TestCICDWebAPI/TestCICDWebAPI.csproj -c Release -o ./publish

      - name: Create deployment package
        run: |
          cd publish
          zip -r ../TestCICDWebAPI.zip .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestCICDWebAPI
          path: TestCICDWebAPI.zip


  # -------------------------
  # CD - Deploy to AWS
  # -------------------------
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: TestCICDWebAPI

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::905658597203:role/GitHubActions-TestCICDWebAPI3
          aws-region: us-east-2

      - name: Upload package to S3
        run: |
          aws s3 cp TestCICDWebAPI.zip \
            s3://testcicdwebapi3-deployment-092026/deploy/TestCICDWebAPI-${{ github.sha }}.zip

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-075eff4bf0d5c2c98 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo Starting deployment...",
              "sudo rm -rf /opt/cicdwebapi-backup",
              "sudo mkdir -p /opt/cicdwebapi-backup",
              "sudo cp -a /opt/cicdwebapi/. /opt/cicdwebapi-backup/",
              "echo Current application backed up",
              "aws s3 cp s3://testcicdwebapi3-deployment-092026/deploy/TestCICDWebAPI-${{ github.sha }}.zip /tmp/TestCICDWebAPI.zip",
              "sudo rm -rf /opt/cicdwebapi/*",
              "sudo unzip -o /tmp/TestCICDWebAPI.zip -d /opt/cicdwebapi",
              "sudo chown -R ssm-user:ssm-user /opt/cicdwebapi",
              "sudo systemctl restart cicdwebapi",
              "echo Waiting for application to start...",
              "for i in {1..12}; do if curl --fail --silent --show-error http://127.0.0.1:5000/health; then echo New deployment is healthy; exit 0; fi; echo Application not ready yet... retrying in 5 seconds; sleep 5; done; echo New deployment failed health check; echo Rolling back...; sudo rm -rf /opt/cicdwebapi/*; sudo cp -a /opt/cicdwebapi-backup/. /opt/cicdwebapi/; sudo chown -R ssm-user:ssm-user /opt/cicdwebapi; sudo systemctl restart cicdwebapi; sleep 5; echo Previous version restored; exit 1"
              ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-075eff4bf0d5c2c98

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-075eff4bf0d5c2c98

      - name: Health check
        run: |
          echo "Checking public HTTPS endpoint..."

          for i in {1..12}; do
            if curl --fail --silent --show-error https://saswatmallik.in/health; then
              echo "Health check passed!"
              exit 0
            fi

            echo "Public endpoint not ready yet... retrying in 5 seconds."
            sleep 5
          done

          echo "Health check failed after 60 seconds."
          exit 1
name: .NET CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # -------------------------
  # CI - Build and Test
  # -------------------------
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish application
        run: dotnet publish ./TestCICDWebAPI/TestCICDWebAPI.csproj -c Release -o ./publish

      - name: Create deployment package
        run: |
          cd publish
          zip -r ../TestCICDWebAPI.zip .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestCICDWebAPI
          path: TestCICDWebAPI.zip


  # -------------------------
  # CD - Deploy to AWS
  # -------------------------
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: TestCICDWebAPI

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::905658597203:role/GitHubActions-TestCICDWebAPI3
          aws-region: us-east-2

      - name: Upload package to S3
        run: |
          aws s3 cp TestCICDWebAPI.zip \
            s3://testcicdwebapi3-deployment-092026/deploy/TestCICDWebAPI-${{ github.sha }}.zip

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-075eff4bf0d5c2c98 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://testcicdwebapi3-deployment-092026/deploy/TestCICDWebAPI-${{ github.sha }}.zip /tmp/TestCICDWebAPI.zip",
              "sudo rm -rf /opt/cicdwebapi/*",
              "sudo unzip -o /tmp/TestCICDWebAPI.zip -d /opt/cicdwebapi",
              "sudo systemctl restart cicdwebapi"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-075eff4bf0d5c2c98

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-075eff4bf0d5c2c98